<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<!-- 세미나 히어로 배너 v00.02 (2026-11-12) — v00.02: Semo Design System Guide 컬러, 투명 빛번짐 제거 — 실제 로고·실제 제품 화면만 사용, 확정된 사실(일정·방식·정원)만 표기 -->
<link rel="stylesheet" href="f/fontsource-noto-sans-kr-5.0.19/500.css">
<link rel="stylesheet" href="f/fontsource-noto-sans-kr-5.0.19/700.css">
<link rel="stylesheet" href="f/fontsource-noto-sans-kr-5.0.19/900.css">
<link rel="stylesheet" href="f/fontsource-inter-5.0.18/600.css">
<style>
:root{--ink:#000000;--muted:#8A8A8B;--mint:#17BF98;--mint-700:#12997A;--mint-50:#F3FFF4}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1672px;height:940px;overflow:hidden;font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  background:#F9F9F9;position:relative;word-break:keep-all}
/* 부드러운 빛 번짐 — 배경에만 */
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.g1{width:760px;height:760px;right:-120px;top:-220px;background:rgba(44,186,160,.22)}
.g2{width:620px;height:620px;right:380px;bottom:-320px;background:rgba(120,170,255,.18)}
.g3{width:520px;height:520px;left:-200px;top:-160px;background:rgba(44,186,160,.10)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#EBEBEB 1.6px,transparent 1.6px);background-size:26px 26px}
.panel{position:absolute;left:0;top:0;bottom:0;width:860px;background:#fff;border-right:1px solid #EBEBEB}
.grid{display:none;position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 70% 50%,#000 30%,transparent 75%)}

.left{position:absolute;left:96px;top:84px;width:700px}
.logo{height:52px;display:block}
h1{margin-top:74px;font-size:112px;line-height:1.08;font-weight:900;letter-spacing:-.045em}
h1 .hl{position:relative;color:var(--mint-700);display:inline-block}
h1 .hl svg.swoosh{position:absolute;left:-6px;right:-10px;bottom:-26px;width:calc(100% + 16px);height:34px}
.spark{position:absolute}
.sub{margin-top:58px;padding-left:24px;border-left:5px solid var(--mint);font-size:31px;line-height:1.5;font-weight:500;color:var(--muted)}
.cta{margin-top:52px;display:inline-flex;align-items:center;gap:18px;height:96px;padding:0 44px 0 48px;border-radius:24px;background:var(--mint);color:#fff;font-size:38px;font-weight:700;box-shadow:0 18px 40px -16px rgba(0,0,0,.30)}

/* 제품 화면 */
.stage{position:absolute;left:820px;top:150px;width:800px;height:700px}
.browser{position:absolute;left:30px;top:70px;width:770px;border-radius:22px;background:#fff;border:1px solid #E2E8EA;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.06);overflow:hidden;transform:rotate(-2.5deg)}
.bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid #EEF2F3;background:#FBFCFC}
.bar i{width:11px;height:11px;border-radius:50%;background:#E3E8EA}
.bar span{margin-left:12px;font-size:14px;color:#8B989D;font-weight:500}
.browser img{display:block;width:100%}
.phone{position:absolute;left:578px;top:318px;width:236px;height:400px;border-radius:38px;background:#0E1A1F;padding:12px;
  box-shadow:0 40px 70px -24px rgba(0,0,0,.55);transform:rotate(5deg)}
.phone .scr{width:100%;height:100%;border-radius:28px;overflow:hidden;background:#fff}
.phone img{display:block;width:100%}

/* 떠 있는 사실 카드 — 확정된 정보만 */
.chip{position:absolute;display:flex;align-items:center;gap:18px;padding:22px 30px 22px 22px;border-radius:24px;
  background:#fff;border:1px solid #EBEBEB;
  box-shadow:0 24px 50px -22px rgba(0,0,0,.28)}
.chip .ic{width:58px;height:58px;border-radius:16px;background:var(--mint-50);display:grid;place-items:center;flex-shrink:0}
.chip b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.chip small{display:block;margin-top:2px;font-size:19px;color:var(--muted);font-weight:500}
.c1{left:900px;top:70px}
.c2{right:48px;top:92px}
.c3{left:880px;bottom:64px}
</style></head>
<body>
<div class="dots"></div><div class="panel"></div>

<div class="left">
  <img class="logo" src="logo_br.png" alt="세모리포트">
  <h1>세모리포트<br>사용법 <span class="hl">세미나
    <svg class="swoosh" viewBox="0 0 300 34" preserveAspectRatio="none"><path d="M4 24 C 80 8, 200 6, 296 18" fill="none" stroke="#17BF98" stroke-width="9" stroke-linecap="round"/></svg>
  </span></h1>
  <svg class="spark" style="left:640px;top:150px" width="70" height="70" viewBox="0 0 70 70"><g stroke="#17BF98" stroke-width="7" stroke-linecap="round"><path d="M14 40 L4 52"/><path d="M30 30 L30 8"/><path d="M46 40 L64 30"/></g></svg>
  <p class="sub">매월 셋째 주 수요일, 온라인으로 진행합니다<br>정원 제한 없이 원하는 회차를 골라 신청하세요</p>
  <div class="cta">세미나 신청하기
    <svg width="22" height="34" viewBox="0 0 22 34"><path d="M4 4l13 13L4 30" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>

<div class="stage">
  <div class="browser"><div class="bar"><i></i><i></i><i></i><span>세모리포트 · 대시보드</span></div><img src="product-dashboard.png" alt=""></div>
  <div class="phone"><div class="scr"><img src="mobile.png" alt=""></div></div>
</div>

<div class="chip c1"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#12997A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><div><b>매월 셋째 주 수요일</b><small>원하는 회차 선택</small></div></div>
<div class="chip c2"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#12997A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div><div><b>온라인 진행</b><small>어디서나 참여</small></div></div>
<div class="chip c3"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#12997A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.3c3 .2 5.5 2.6 5.5 5.7"/></svg></div><div><b>정원 제한 없음</b><small>누구나 신청 가능</small></div></div>
</body></html>
