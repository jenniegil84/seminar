<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<!-- 신청 페이지 제품 이미지 v00.02(칩 아이콘에 가이드 별도 컬러) (2026-11-12) — Semo Design System Guide 컬러 · 실제 제품 화면만 -->
<link rel="stylesheet" href="f/fontsource-noto-sans-kr-5.0.19/500.css"><link rel="stylesheet" href="f/fontsource-noto-sans-kr-5.0.19/700.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1120px;height:600px;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:#F9F9F9;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(#EBEBEB 1.4px,transparent 1.4px);background-size:22px 22px}
.browser{position:absolute;left:40px;top:58px;width:800px;border-radius:18px;background:#fff;border:1px solid #EBEBEB;overflow:hidden;
  box-shadow:0 30px 60px -28px rgba(0,0,0,.28)}
.bar{height:36px;display:flex;align-items:center;gap:7px;padding:0 16px;border-bottom:1px solid #EBEBEB;background:#F9F9F9}
.bar i{width:10px;height:10px;border-radius:50%;background:#EBEBEB}
.bar span{margin-left:10px;font-size:13px;color:#8A8A8B;font-weight:500}
.browser img{display:block;width:100%}
.phone{position:absolute;left:800px;top:120px;width:236px;height:420px;border-radius:36px;background:#000;padding:11px;
  box-shadow:0 34px 60px -24px rgba(0,0,0,.45);transform:rotate(4deg)}
.phone .scr{width:100%;height:100%;border-radius:26px;overflow:hidden;background:#fff}
.phone img{display:block;width:100%}
.chip{position:absolute;display:flex;align-items:center;gap:14px;padding:16px 22px 16px 16px;border-radius:18px;background:#fff;border:1px solid #EBEBEB;
  box-shadow:0 18px 36px -20px rgba(0,0,0,.25)}
.chip .ic{width:44px;height:44px;border-radius:12px;background:#F3FFF4;display:grid;place-items:center}
.chip b{display:block;font-size:19px;font-weight:700;color:#000;letter-spacing:-.02em}
.chip small{display:block;font-size:14px;color:#8A8A8B;font-weight:500}
.c1{left:690px;top:22px}.c2{left:12px;top:470px}.c3{left:880px;top:500px}
.accent{position:absolute;left:40px;top:58px;width:120px;height:5px;border-radius:3px;background:#17BF98;transform:translateY(-14px)}
</style></head><body><div class="dots"></div>
<div class="accent"></div>
<div class="browser"><div class="bar"><i></i><i></i><i></i><span>세모리포트 · 대시보드</span></div><img src="product-dashboard.png" alt=""></div>
<div class="phone"><div class="scr"><img src="mobile.png" alt=""></div></div>
<div class="chip c1"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0088FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><div><b>매월 셋째 주 수요일</b><small>원하는 회차 선택</small></div></div>
<div class="chip c2"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5D72DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div><div><b>온라인 진행</b><small>어디서나 참여</small></div></div>
<div class="chip c3"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFB623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.3c3 .2 5.5 2.6 5.5 5.7"/></svg></div><div><b>정원 제한 없음</b><small>누구나 신청 가능</small></div></div>
</body></html>
